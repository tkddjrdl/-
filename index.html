<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 20px; background: #f5f5f5; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; }
    #result { margin-top: 20px; font-size: 18px; font-weight: bold; }
    .success { color: green; }
    .fail { color: red; }
  </style>
</head>
<body>
  <h2>입고 스캔</h2>
  <div id="reader"></div>
  <div id="result"></div>

  <script>
    const GAS_URL = "여기에_Apps_Script_웹앱_URL_붙여넣기";
    var scanning = true;

    function onScanSuccess(decodedText) {
      if (!scanning) return;
      scanning = false;
      document.getElementById('result').innerHTML = '처리 중...';

      fetch(GAS_URL + "?mawb=" + encodeURIComponent(decodedText), {
  method: "GET",
  mode: "no-cors"
})
.then(() => {
  document.getElementById('result').innerHTML =
    '<span class="success">입고 처리 완료<br>' + decodedText + '</span>';
  setTimeout(() => {
    scanning = true;
    document.getElementById('result').innerHTML = '';
  }, 3000);
})
.catch(() => {
  document.getElementById('result').innerHTML =
    '<span class="fail">오류 발생. 다시 시도하세요.</span>';
  setTimeout(() => {
    scanning = true;
    document.getElementById('result').innerHTML = '';
  }, 3000);
});
    }

    var scanner = new Html5QrcodeScanner("reader", { fps: 10, qrbox: 250 }, false);
    scanner.render(onScanSuccess);
  </script>
</body>
</html>
